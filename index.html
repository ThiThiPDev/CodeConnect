<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles.css">

    <title>CodeConnect</title>
</head>

<body>
    <aside>
    <img src="./img/Logo CodeConnect.svg" alt="Logo do CodeConnect">

    <button class="menu-hamburguer" aria-label="Abrir menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <nav class="menu">
        <ul class="lista-links">
            <li>
                <a href="#" class="link-destaque">
                Publicar
                    <img src="./img/arrow_forward2.svg">
                </a>
            </li>
            <li>
                <a href="#">
                    <img src="./img/feed.svg" alt="">
                    Feed
                </a>
            </li>
            <li>
                <a href="#">
                    <img src="./img/account_circle.svg" alt="">
                    Perfil
                </a>
            </li>
            <li>
                <a href="#">
                    <img src="./img/info.svg" alt="">
                    Sobre nós
                </a>
            </li>
            <li>
                <a href="#">
                    <img src="./img/logout.svg" alt="">
                    Sair
                </a>
            </li>
        </ul>
    </nav>
</aside>

    <main>
        <div class="container-upload-imagem">
            <div class="container-imagem">
                <img src="./img/imagem1.png" alt="Exemplo de imagem" class="main-image">
            </div>

            <button id="upload-btn">Carregar imagem</button>

            <input type="file" id="image-upload" accept="image/*" style="display: none">

            <div class="container-imagem-nome">
                <p>image_projeto.png</p>
                <img src="./img/close.svg">
            </div>
        </div>

        <div class="container-descricao">
            <h2 class="titulo-projeto">Novo Projeto</h2>

            <form>
                <div>
                    <label for="nome">📝Nome do projeto</label>
                    <input type="text" id="nome" name="nome" maxlength="50" placeholder="Digite um nome para o projeto" />
                    <small id="contador-nome">0/50 caracteres</small>
                </div>

                <div>
                    <label for="descricao">📖Descrição</label>
                    <textarea id="descricao" name="descricao" maxlength="395" placeholder="Digite uma descrição para o projeto"></textarea>
                    <small id="contador-descricao">0/395 caracteres</small>
                </div>

                <div class="container-categorias">
                    <label for="input-tags">🏷️Tags disponíveis</label>

                    <p class="descricao-tags">
                        Escolha entre as categorias aceitas no projeto:
                    </p>

                    <div class="tags-disponiveis">
                        <span>Front-End</span>
                        <span>Programação</span>
                        <span>Data Science</span>
                        <span>Full-Stack</span>
                        <span>HTML</span>
                        <span>CSS</span>
                        <span>JavaScript</span>
                        <span>Back-End</span>
                        <span>VS Code</span>
                    </div>

                    <input type="text" name="categoria" id="input-tags" placeholder="Digite uma tag e pressione Enter" />
                </div>

                <ul class="lista-tags" id="lista-tags">

                </ul>

                <div class="container-botoes">
                    <button class="botao-descartar">Descartar</button>
                    <button class="botao-publicar">Publicar</button>
                </div>
            </form>
        </div>
    </main>

    <script src="scripts.js"></script>
</body>

</html>
